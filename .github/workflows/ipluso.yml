name: ipluso Group Buy Monitor

on:
  schedule:
    # 台灣時間每日 18:00 執行（UTC 時間 10:00）
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Run ipluso monitor
        env:
          IPLUSO_URL: ${{ secrets.IPLUSO_URL }}
          IPLUSO_COOKIE: ${{ secrets.IPLUSO_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python ipluso.py
