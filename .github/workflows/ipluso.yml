name: ipluso Group Buy Monitor

on:
  schedule:
    # 台灣時間每日 18:00 執行（UTC 時間 10:00）
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      range_start:
        description: "測試用：統計起日（例如 2026-10-01，留空 = 一般執行）"
        required: false
        default: ""
      range_end:
        description: "測試用：統計迄日（例如 2026-10-14）"
        required: false
        default: ""

permissions:
  contents: write

concurrency: ipluso

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ipluso monitor
        env:
          IPLUSO_URL: ${{ secrets.IPLUSO_URL }}
          IPLUSO_COOKIE: ${{ secrets.IPLUSO_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python ipluso.py ${{ inputs.range_start && format('--range {0} {1}', inputs.range_start, inputs.range_end) || '' }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ipluso_state.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "update ipluso state" && git pull --rebase && git push)
