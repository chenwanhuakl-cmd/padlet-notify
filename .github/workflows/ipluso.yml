name: ipluso Group Buy Monitor

on:
  schedule:
    # 台灣時間每日 18:00 執行（UTC 時間 10:00）
    - cron: "0 10 * * *"
    # 台灣時間每日 08:00（UTC 00:00）：只讀取 Telegram 的個人支出訊息
    - cron: "0 0 * * *"
  # 外部排程（cron-job.org）準時觸發用。
  # GitHub 自己的排程 11/20 起常遲到 8～12 小時，單靠它會半夜才收到團購提醒。
  #   ipluso          → 傍晚那班（取貨提醒／統計）
  #   ipluso-personal → 早上那班（只讀個人支出訊息）
  repository_dispatch:
    types: [ipluso, ipluso-personal]
  workflow_dispatch:
    inputs:
      range_start:
        description: "測試用：統計起日（例如 2026-10-01，留空 = 一般執行）"
        required: false
        default: ""
      range_end:
        description: "測試用：統計迄日（例如 2026-10-14）"
        required: false
        default: ""

permissions:
  contents: write

concurrency: ipluso

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ipluso monitor
        env:
          IPLUSO_URL: ${{ secrets.IPLUSO_URL }}
          IPLUSO_COOKIE: ${{ secrets.IPLUSO_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python ipluso.py ${{ (github.event.schedule == '0 0 * * *' || github.event.action == 'ipluso-personal') && '--personal-only' || '' }} ${{ inputs.range_start && format('--range {0} {1}', inputs.range_start, inputs.range_end) || '' }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ipluso_state.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "update ipluso state" && git pull --rebase && git push)
