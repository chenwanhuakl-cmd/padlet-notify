name: 檢查聯絡簿

on:
  schedule:
    # GitHub 用 UTC 時間（台灣時間 -8 小時）
    # 台灣時間 週一～週六 12:50 開始，每 10 分鐘一次到 22:00
    # 週六只有遇到補班日才會真的檢查，其他假日由程式依行事曆跳過
    - cron: "50 4 * * 1-6"
    - cron: "*/10 5-13 * * 1-6"
  workflow_dispatch:
    inputs:
      test:
        description: "傳送最新一篇做測試"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Padlet
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check.py ${{ inputs.test && '--test' || '' }} ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
