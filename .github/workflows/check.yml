name: 檢查聯絡簿

on:
  # 全部交給外部排程（cron-job.org）觸發：台灣時間 週一～週六 12:00 起每 10 分鐘一次到 21:50。
  # GitHub 自己的 schedule 已經拿掉——排程表上一天 55 個時段它實際只觸發 1～3 次，
  # 而且都遲到到 23:00 之後或凌晨才跑，等於只是在亂發。
  # 週六只有遇到補班日才會真的檢查，其他假日由程式依行事曆跳過。
  repository_dispatch:
    types: [check]
  workflow_dispatch:
    inputs:
      test:
        description: "傳送最新一篇做測試"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Padlet
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python check.py ${{ inputs.test && '--test' || '' }} ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
