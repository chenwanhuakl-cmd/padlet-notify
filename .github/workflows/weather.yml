name: 今日降雨提醒

on:
  schedule:
    # GitHub 用 UTC 時間（台灣時間 -8 小時）
    # 台灣時間每天 06:30 啟動（GitHub 排程常延遲，提早啟動），程式等到 07:05 才發
    # 假日由程式依行事曆跳過（補班日照發）
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency: weather

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rain forecast
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python weather.py ${{ github.event_name == 'workflow_dispatch' && '--now' || '' }}
